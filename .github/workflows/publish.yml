name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/profileout
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'profileout');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.RELEASE_TAG, 'v' + pkg.version, 'Release tag must match package.json');
          JS
      - name: Check SDK and package contents
        run: |
          npm run check
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { ProfileOut, ProfileOutError } from './index.js';
          assert.equal(typeof new ProfileOut({ apiKey: 'ci-check' }).createPeopleData, 'function');
          assert.ok(new ProfileOutError('check') instanceof Error);
          JS
          npm pack --dry-run
      - name: Publish with Trusted Publishing
        run: npm publish --access public --registry=https://registry.npmjs.org
